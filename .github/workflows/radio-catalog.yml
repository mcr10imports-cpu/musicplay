name: Radio catalog
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/radio-catalog.yml'
permissions:
  contents: write
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python - <<'PY'
          import json, urllib.request
          for host in ['de1','de2','nl1','at1']:
              try:
                  req=urllib.request.Request('https://'+host+'.api.radio-browser.info/json/stations/search?countrycode=BR&hidebroken=true&limit=5000&order=votes&reverse=true',headers={'User-Agent':'MusicPlay/3.4'})
                  rows=json.load(urllib.request.urlopen(req,timeout=25))
                  rows=[{k:x.get(k) for k in ('stationuuid','name','state','country','tags','url_resolved','favicon')} for x in rows if str(x.get('url_resolved','')).startswith('https://')]
                  if not rows: continue
                  with open('radio-catalog.json','w') as f: json.dump(rows,f,ensure_ascii=False)
                  break
              except Exception as e: print(e)
          else: raise SystemExit('Catalog unavailable')
          PY
          git config user.name musicplay-catalog
          git config user.email musicplay-catalog@users.noreply.github.com
          git add radio-catalog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh radio catalog'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
