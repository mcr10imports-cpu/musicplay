="home()" aria-label="Início">⌂</button><form id="search"><input id="q" placeholder="Música, artista ou álbum" required><button class="green">Buscar</button></form><select id="filter" aria-label="Filtro"><option value="">Todos os vídeos</option><option value="10">Música</option></select></header><aside id="library"></aside><main id="main"></main><aside id="now"><h2>Reproduzindo agora</h2><div id="player"></div><p id="emptyNow">Escolha uma música para começar.</p></aside><footer id="bar"><div id="track">Nenhuma música selecionada</div><div id="transportCenter"><div id="controls"><button id="random" class="transport" title="Aleatório" aria-label="Aleatório" onclick="shuffle()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h3c5 0 7 12 12 12h3m-4-4 4 4-4 4M3 18h3c2 0 4-3 6-6m3-4c1-2 2-2 3-2h3m-4-4 4 4-4 4"/></svg></button><button  class="transport" title="Anterior" aria-label="Anterior" onclick="previousTrack()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" d="M6 5h2v14H6zm13 0L9 12l10 7z"/></svg></button><button id="pause" class="transport" title="Reproduzir ou pausar" aria-label="Reproduzir ou pausar" onclick="togglePlay()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" d="m9 5 12 7-12 7z"/></svg></button><button  class="transport" title="Próxima" aria-label="Próxima" onclick="step(1)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path fill="currentColor" d="M18 5h-2v14h2zM5 5l10 7-10 7z"/></svg></button><button id="repeat" class="transport" title="Repetir" aria-label="Repetir" onclick="repeat()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4M3 11V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4m14-1v3a2 2 0 0 1-2 2H3"/></svg></button></div><div id="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Posição da música"><span id="duration">0:00</span></div></div><div id="volumebox"><button  class="transport" title="Letras: pesquisar" aria-label="Letras: pesquisar" onclick="lyricsSearch()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3"/></svg></button><button  class="transport" title="Fila de reprodução" aria-label="Fila de reprodução" onclick="show('Fila',queue)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18M3 10h18M3 15h12M3 20h12"/></svg></button><button  class="transport" title="Dispositivo de áudio" aria-label="Dispositivo de áudio" onclick="audioDevice()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="12" height="15" rx="2"/><rect x="17" y="8" width="5" height="12" rx="1"/></svg></button><button id="mute" class="transport" title="Silenciar ou restaurar volume" aria-label="Silenciar ou restaurar volume" onclick="muteToggle()"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3zM const $=id=>document.getElementById(id), main=$('main');let db;try{db=JSON.parse(localStorage.musicplay)||{}}catch{db={}};db.fav??=[];db.hist??=[];db.lists??={};let queue=[],idx=0,results=[],randomMode=false,repeatMode=0,yt=null,token=0;const save=()=>{localStorage.musicplay=JSON.stringify(db);renderLibrary()};function el(tag,t,parent=main){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}function btn(t,f,p=main){let e=el('button',t,p);e.onclick=f;return e}function clear(t){main.replaceChildren();el('h2',t);renderLibrary()}function home(){clear('Início');let hero=el('section','');hero.className='hero';el('small','MUSICPLAY • SUA MÚSICA',hero);el('h2','O que vamos ouvir hoje?',hero);el('p','Encontre seus artistas e monte sua própria coleção.',hero);btn('Explorar músicas',()=>search('músicas gospel'),hero);let c=el('div','');c.className='cats';['Gospel','Louvor','Sertanejo','Rock','Pop','Instrumental'].forEach(x=>btn(x,()=>search(x+' músicas'),c));el('h2','Sua biblioteca');btn('Minhas playlists',lists);btn('↓ Downloads offline',offline);btn('Adicionar link do YouTube',addLink);if(db.hist.length)showRecent()}function settings(){clear('Configurações');el('p','Para buscar dentro do aplicativo, informe uma chave da YouTube Data API v3. Sem chave, a busca abre o YouTube e você pode adicionar links manualmente.');let i=el('input','');i.type='password';i.placeholder='Chave da API';i.value=db.key||'';btn('Salvar',()=>{db.key=i.value.trim();save();home()});let a=el('a','Criar chave no Google Cloud');a.href='https://console.cloud.google.com/apis/library/youtube.googleapis.com';a.target='_blank';el('p','Dados salvos neste navegador. Não há sincronização entre aparelhos.');btn('Exportar playlists',exportLists);btn('Importar playlists',importLists);el('p','MusicPlay V1.4.1')}async function search(q){$('q').value=q;clear('Busca: '+q);if(!db.key){let a=el('a','Buscar no YouTube ↗');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q);a.target='_blank';el('p','Copie o link da música escolhida e adicione à biblioteca.');btn('Adicionar link',addLink);btn('Configurar busca integrada',settings);return}el('p','Buscando…');try{let r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=20&q='+encodeURIComponent(q) + ($('filter').value?'&videoCategoryId=10':'')+'&key='+encodeURIComponent(db.key));let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erro');results=j.items.map(v=>({id:v.id.videoId,title:new DOMParser().parseFromString(v.snippet.title,'text/html').body.textContent,artist:v.snippet.channelTitle}));show('Resultados',results)}catch(e){clear('Não foi possível buscar');el('p',e.message);btn('Ajustes',settings)}}$('search').onsubmit=e=>{e.preventDefault();search($('q').value)};function addLink(){let s=prompt('Cole o link do vídeo do YouTube');if(!s)return;let id;try{let u=new URL(s);if(u.hostname==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.split('/')[2]}catch{}if(!/^[\w-]{11}$/.test(id||'')){alert('Link inválido');return}let title=prompt('Nome da música')||'Vídeo do YouTube';let v={id,title,artist:''};show('Música adicionada',[v]);play([v],0)}function show(t,arr){clear(t);if(!arr.length)el('p','Nenhuma música por enquanto.');arr.forEach((v,i)=>{let a=el('article',''),r=el('div','',a);r.className='row';let im=el('img','',r);im.src=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';let d=el('div','',r);el('strong',v.title,d);el('p',v.artist||'',d);let b=el('div','',a);b.className='row';btn('▶',()=>play(arr,i),b);btn(db.fav.some(x=>x.id===v.id)?'♥':'♡',()=>{db.fav=db.fav.some(x=>x.id===v.id)?db.fav.filter(x=>x.id!==v.id):[v,...db.fav];save();show(t,t==='Favoritos'?db.fav:arr)},b);btn('+ Lista',()=>{let n=prompt('Nome da playlist (existente ou nova):',Object.keys(db.lists)[0]||'');if(!n?.trim())return;n=n.trim();if(!Object.hasOwn(db.lists,n))Object.defineProperty(db.lists,n,{value:[],writable:true,enumerable:true,configurable:true});if(!db.lists[n].some(x=>x.id===v.id))db.lists[n].push(v);save();alert('Adicionada!')},b);if(t.startsWith('Playlist: ')){if(i>0)btn('↑',()=>move(t,arr,i,-1),b);if(i<arr.length-1)btn('↓',()=>move(t,arr,i,1),b)}if(t.startsWith('Playlist: '))btn('Remover',()=>{let n=t.slice(10);db.lists[n]=arr.filter((_,k)=>k!==i);save();show(t,db.lists[n])},b)})}function lists(){clear('Minhas playlists');btn('+ Nova playlist',()=>{let n=prompt('Nome da playlist');if(n?.trim()&&!Object.hasOwn(db.lists,n.trim())){Object.defineProperty(db.lists,n.trim(),{value:[],enumerable:true,configurable:true,writable:true});save();lists()}});Object.keys(db.lists).forEach(n=>{let a=el('article','');el('h3',n,a);el('p',db.lists[n].length+' músicas',a);btn('Abrir',()=>show('Playlist: '+n,db.lists[n]),a);btn('▶ Tocar',()=>play(db.lists[n],0),a);btn('Renomear',()=>{let m=prompt('Novo nome',n);if(m?.trim()&&!Object.hasOwn(db.lists,m.trim())){Object.defineProperty(db.lists,m.trim(),{value:db.lists[n],enumerable:true,writable:true,configurable:true});delete db.lists[n];save();lists()}},a);btn('Excluir',()=>{if(confirm('Excluir playlist?')){delete db.lists[n];save();lists()}},a)})}function showRecent(){el('h2','Ouvidos recentemente');let g=el('div','');g.className='recentgrid';db.hist.slice(0,8).forEach((v,i)=>{let x=btn('',()=>play(db.hist,i),g);let im=el('img','',x);im.src=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';el('strong',v.title,x)})}
function renderLibrary(){let p=$('library');p.replaceChildren();el('h2','Sua biblioteca',p);btn('+ Criar playlist',()=>{let n=prompt('Nome da playlist');if(n?.trim()&&!Object.hasOwn(db.lists,n.trim())){Object.defineProperty(db.lists,n.trim(),{value:[],enumerable:true,writable:true,configurable:true});save();lists()}},p);btn('♥ Músicas curtidas',()=>show('Favoritos',db.fav),p);btn('◷ Histórico',()=>show('Histórico',db.hist),p);btn('☷ Todas as playlists',lists,p);btn('↓ Downloads',offline,p);btn('⚙ Ajustes',settings,p);Object.keys(db.lists).forEach(n=>{let x=btn('',()=>show('Playlist: '+n,db.lists[n]),p);x.className='libitem';let v=db.lists[n][0];if(v){let im=el('img','',x);im.src=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg'}let d=el('div','',x);el('strong',n,d);el('small',db.lists[n].length+' músicas',d)})}
function togglePlay(){if(!queue.length){if(results.length){play(results,0);return}home();$('q').focus();return}if(offlineAudio){if(offlineAudio.paused)offlineAudio.play().catch(()=>{});else offlineAudio.pause();return}if(!playerReady){requestPlayback();return}try{if(yt.getPlayerState()===1){wantsPlay=false;yt.pauseVideo()}else requestPlayback()}catch{requestPlayback()}}
function fmt(t){t=Math.floor(t||0);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}
$('seek').onchange=()=>{if(offlineAudio){if(Number.isFinite(offlineAudio.duration))offlineAudio.currentTime=offlineAudio.duration*Number($('seek').value)/100;return}if(yt?.getDuration)yt.seekTo(yt.getDuration()*Number($('seek').value)/100,true)};
$('volume').oninput=()=>{if(offlineAudio){offlineAudio.volume=Number($('volume').value)/100;return}if(yt?.setVolume)yt.setVolume(Number($('volume').value))};
setInterval(()=>{try{if(!yt?.getDuration)return;let d=yt.getDuration(),t=yt.getCurrentTime();$('elapsed').textContent=fmt(t);$('duration').textContent=fmt(d);if(document.activeElement!==$('seek'))$('seek').value=d?t/d*100:0;$('pause').textContent=yt.getPlayerState()===1?'❚❚':'▶'}catch{}},500);
function move(t,a,i,d){[a[i],a[i+d]]=[a[i+d],a[i]];save();show(t,a)}
function exportLists(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({lists:db.lists},null,2)],{type:'application/json'}));a.download='musicplay-playlists.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importLists(){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let j=JSON.parse(await f.files[0].text());if(!j.lists||typeof j.lists!=='object'||Array.isArray(j.lists))throw Error();for(let [n,a] of Object.entries(j.lists)){if(!n.trim()||!Array.isArray(a)||!a.every(v=>v&&(/^[\w-]{11}$/.test(v.id)||/^local-[a-f0-9-]{36}$/.test(v.id))&&typeof v.title==='string'))throw Error()}for(let [n,a] of Object.entries(j.lists)){let old=Object.hasOwn(db.lists,n)?db.lists[n]:[];Object.defineProperty(db.lists,n,{value:[...new Map([...old,...a.map(v=>({id:v.id,title:v.title,artist:String(v.artist||'')}))].map(v=>[v.id,v])).values()],writable:true,enumerable:true,configurable:true})}save();lists()}catch{alert('Arquivo inválido')}};f.click()}
let apiReady=new Promise((resolve,reject)=>{if(window.YT?.Player){resolve();return}window.onYouTubeIframeAPIReady=resolve;let script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';script.onerror=()=>reject(Error('API do player indisponível'));document.head.append(script)});apiReady.catch(()=>{});let playerReady=false,wantsPlay=true;
function sendPlayerCommand(command){let frame=$('ytframe');if(frame?.contentWindow)frame.contentWindow.postMessage(JSON.stringify({event:'command',func:command,args:[]}), 'https://www.youtube.com')}
function requestPlayback(){wantsPlay=true;try{if(playerReady&&yt?.playVideo)yt.playVideo();else sendPlayerCommand('playVideo')}catch{sendPlayerCommand('playVideo')}}
function play(a,i){if(!a[i])return;playerReady=false;wantsPlay=true;document.body.classList.remove('panelHidden');if(a[i].id.startsWith('local-')){playLocal(a,i);return}stopLocal();queue=a.slice();idx=i;let v=queue[idx],current=++token;db.hist=[v,...db.hist.filter(x=>x.id!==v.id)].slice(0,100);save();if(yt){try{yt.destroy()}catch{}yt=null}document.body.classList.add('playing');$('emptyNow').hidden=true;let tr=$('track');tr.replaceChildren();let cover=el('img','',tr);cover.src='https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';let td=el('div','',tr);el('strong',v.title,td);el('small',v.artist||'',td);let p=$('player');p.replaceChildren();el('strong',v.title,p);let f=el('iframe','',p);f.id='ytframe';f.title=v.title;f.referrerPolicy='strict-origin-when-cross-origin';f.src='https://www.youtube.com/embed/'+v.id+'?playsinline=1&autoplay=1&enablejsapi=1&origin='+encodeURIComponent(location.origin);f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen';f.allowFullscreen=true;let status=el('p','',p);let l=el('a','Abrir no YouTube',p);l.href='https://www.youtube.com/watch?v='+v.id;l.target='_blank';l.rel='noopener';$('controls').hidden=false;apiReady.then(()=>{if(current!==token)return;yt=new YT.Player(f,{events:{onReady:e=>{if(current!==token)return;playerReady=true;try{e.target.setVolume(Number($('volume').value));if(wantsPlay)e.target.playVideo()}catch{requestPlayback()}},onAutoplayBlocked:()=>{if(current===token)status.textContent='Reprodução automática bloqueada pelo navegador. Toque no Play inferior novamente ou no vídeo.'},onStateChange:e=>{if(current===token&&e.data===0){if(repeatMode===1)play(queue,idx);else if(randomMode||idx<queue.length-1||repeatMode===2)step(1)}},onError:()=>{if(current===token)status.textContent='Vídeo indisponível. Abra no YouTube ou avance.'}}})}).catch(()=>{if(current===token)status.textContent='Não foi possível conectar os controles ao YouTube. Recarregue a página.'});p.scrollIntoView({block:'nearest',behavior:'smooth'})}
function step(n){if(!queue.length)return;let next=(idx+n+queue.length)%queue.length;if(randomMode&&n>0&&queue.length>1)next=(idx+1+Math.floor(Math.random()*(queue.length-1)))%queue.length;play(queue,next)}
function shuffle(){randomMode=!randomMode;$('random').setAttribute('aria-pressed',String(randomMode));$('random').classList.toggle('active',randomMode)}
function repeat(){repeatMode=(repeatMode+1)%3;let b=$('repeat');b.title=['Repetir: não','Repetir: uma','Repetir: fila'][repeatMode];b.setAttribute('aria-label',b.title);b.dataset.one=String(repeatMode===1);b.classList.toggle('active',repeatMode!==0)}

let offlineAudio=null,offlineURL=null,offlineItems=[];
const audioDB=new Promise((resolve,reject)=>{let r=indexedDB.open('musicplay-audio',1);r.onupgradeneeded=()=>r.result.createObjectStore('tracks',{keyPath:'id'});r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
async function audioOp(mode,fn){let d=await audioDB;return new Promise((resolve,reject)=>{let t=d.transaction('tracks',mode),r=fn(t.objectStore('tracks'));t.oncomplete=()=>resolve(r.result);t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function storeAudio(blob,title){if(!blob.size||blob.size>100*1024*1024)throw Error('Arquivo vazio ou acima de 100 MB');let v={id:'local-'+crypto.randomUUID(),title,artist:'Biblioteca offline',blob};await audioOp('readwrite',o=>o.put(v));return v}
async function offline(){clear('Downloads e biblioteca offline');el('p','Importe arquivos próprios ou baixe áudio de fontes que autorizem o download. Links do YouTube não são suportados.');let input=el('input','');input.type='url';input.placeholder='https://.../musica.mp3';input.style.width='100%';let status=el('p','');let download=btn('↓ Baixar áudio',async()=>{download.disabled=true;try{let u=new URL(input.value);if(u.protocol!=='https:'||/(^|\.)(youtube\.com|youtu\.be|googlevideo\.com)$/.test(u.hostname))throw Error('Use um link HTTPS direto de áudio autorizado.');if(!confirm('Você tem autorização para baixar este arquivo?'))return;status.textContent='Baixando…';let r=await fetch(u.href,{credentials:'omit'});if(!r.ok)throw Error('Servidor recusou o download');let type=r.headers.get('content-type')||'';if(!type.startsWith('audio/')&&!(/\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(u.pathname)&&type.includes('octet-stream')))throw Error('O endereço não retornou um arquivo de áudio');let length=Number(r.headers.get('content-length'))||0;if(length>100*1024*1024)throw Error('Limite de 100 MB');let reader=r.body.getReader(),parts=[],total=0;while(true){let x=await reader.read();if(x.done)break;total+=x.value.length;if(total>100*1024*1024){await reader.cancel();throw Error('Limite de 100 MB')}parts.push(x.value);status.textContent='Baixando: '+(length?Math.min(100,Math.round(total/length*100))+'%':(total/1048576).toFixed(1)+' MB')}await storeAudio(new Blob(parts,{type}),decodeURIComponent(u.pathname.split('/').pop()||'Música'));offline()}catch(e){status.textContent='Não foi possível baixar: '+e.message+'. O servidor precisa permitir acesso pelo navegador.'}finally{download.disabled=false}});
btn('Importar MP3 / M4A / WAV',()=>{let f=document.createElement('input');f.type='file';f.accept='audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg';f.multiple=true;f.onchange=async()=>{try{for(let x of f.files){if(!x.type.startsWith('audio/')&&!/\.(mp3|m4a|wav|aac|flac|ogg)$/i.test(x.name))continue;await storeAudio(x,x.name)}offline()}catch(e){status.textContent=e.message}};f.click()});
if(navigator.storage?.persist)btn('Solicitar armazenamento persistente',async()=>{status.textContent=await navigator.storage.persist()?'Armazenamento persistente concedido.':'O navegador não concedeu armazenamento persistente.'});
try{offlineItems=await audioOp('readonly',o=>o.getAll());el('h2','Músicas baixadas · '+offlineItems.length);el('p',(offlineItems.reduce((n,v)=>n+v.blob.size,0)/1048576).toFixed(1)+' MB armazenados');let list=offlineItems.map(({blob,...v})=>v);if(list.length)btn('▶ Tocar todas',()=>play(list,0));list.forEach((v,i)=>{let a=el('article','');el('strong',v.title,a);let b=el('div','',a);b.className='row';btn('▶',()=>play(list,i),b);btn('+ Lista',()=>{let n=prompt('Nome da playlist');if(!n?.trim())return;n=n.trim();if(!Object.hasOwn(db.lists,n))Object.defineProperty(db.lists,n,{value:[],writable:true,enumerable:true,configurable:true});if(!db.lists[n].some(x=>x.id===v.id))db.lists[n].push(v);save()},b);btn('Excluir',async()=>{if(confirm('Excluir arquivo offline?')){await audioOp('readwrite',o=>o.delete(v.id));offline()}},b)})}catch(e){status.textContent='Armazenamento indisponível: '+e.message}}
function stopLocal(){if(offlineAudio){offlineAudio.pause();offlineAudio.removeAttribute('src');offlineAudio.load();offlineAudio=null}if(offlineURL){URL.revokeObjectURL(offlineURL);offlineURL=null}}
async function playLocal(a,i){let current=++token;queue=a.slice();idx=i;let v=queue[idx];stopLocal();if(yt){try{yt.destroy()}catch{}yt=null}let p=$('player');p.replaceChildren();document.body.classList.add('playing');$('emptyNow').hidden=true;$('track').textContent=v.title;$('controls').hidden=false;el('strong',v.title,p);try{let file=await audioOp('readonly',o=>o.get(v.id));if(current!==token)return;if(!file)throw Error('Arquivo removido ou indisponível neste aparelho');offlineURL=URL.createObjectURL(file.blob);let audio=el('audio','',p);offlineAudio=audio;audio.controls=true;audio.style.width='100%';audio.src=offlineURL;audio.volume=Number($('volume').value)/100;audio.onended=()=>{if(current!==token)return;if(repeatMode===1)play(queue,idx);else if(randomMode||idx<queue.length-1||repeatMode===2)step(1)};audio.onerror=()=>el('p','Formato não suportado neste aparelho.',p);db.hist=[v,...db.hist.filter(x=>x.id!==v.id)].slice(0,100);save();audio.play().catch(()=>el('p','Toque no botão de reprodução para iniciar.',p))}catch(e){if(current===token)el('p',e.message,p)}}
setInterval(()=>{if(!offlineAudio)return;let d=offlineAudio.duration||0,t=offlineAudio.currentTime;$('elapsed').textContent=fmt(t);$('duration').textContent=fmt(d);if(document.activeElement!==$('seek'))$('seek').value=d?t/d*100:0;$('pause').textContent=offlineAudio.paused?'▶':'❚❚'},500);

function previousTrack(){try{let t=offlineAudio?offlineAudio.currentTime:yt?.getCurrentTime?.();if(t>3){if(offlineAudio)offlineAudio.currentTime=0;else yt.seekTo(0,true);return}}catch{}step(-1)}
function lyricsSearch(){let v=queue[idx];if(!v){alert('Selecione uma música primeiro.');return}window.open('https://www.google.com/search?q='+encodeURIComponent(v.title+' '+(v.artist||'')+' letra'),'_blank','noopener')}
async function audioDevice(){if(offlineAudio?.setSinkId&&navigator.mediaDevices?.selectAudioOutput){try{let d=await navigator.mediaDevices.selectAudioOutput();await offlineAudio.setSinkId(d.deviceId);return}catch(e){alert('Não foi possível selecionar a saída de áudio.');return}}alert('A reprodução usa a saída de áudio do sistema. No iPhone, escolha Bluetooth ou AirPlay pela Central de Controle.')}
let lastVolume=80;function muteToggle(){let v=$('volume');if(Number(v.value)>0){lastVolume=Number(v.value);v.value=0}else v.value=lastVolume||80;v.dispatchEvent(new Event('input'));$('mute').classList.toggle('active',Number(v.value)===0)}
function togglePanel(){document.body.classList.toggle('panelHidden');if(!queue.length&&!document.body.classList.contains('panelHidden'))$('now').style.display='';}
async function fullPlayer(){let p=$('player'),target=p.querySelector('iframe')||p;if(!queue.length){alert('Selecione uma música primeiro.');return}try{if(document.fullscreenElement){await document.exitFullscreen();return}if(target.requestFullscreen){await target.requestFullscreen();return}alert('Tela cheia indisponível neste navegador. Use o controle do vídeo do YouTube.')}catch{alert('Use o controle de tela cheia do vídeo, se disponível.')}}
setInterval(()=>{for(let id of ['seek','volume']){let e=$(id);e.style.setProperty('--fill',e.value+'%')}},250);

home();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
