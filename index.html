const $=id=>document.getElementById(id), main=$('main');let db;try{db=JSON.parse(localStorage.musicplay)||{}}catch{db={}};db.fav??=[];db.hist??=[];db.lists??={};let queue=[],idx=0,results=[],randomMode=false,repeatMode=0,yt=null,token=0;const save=()=>{localStorage.musicplay=JSON.stringify(db);renderLibrary()};function el(tag,t,parent=main){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}function btn(t,f,p=main){let e=el('button',t,p);e.onclick=f;return e}function clear(t){if(matchMedia('(max-width:650px)').matches)document.body.classList.add('panelHidden');main.replaceChildren();el('h2',t);renderLibrary()}function home(){clear('Início');let shortcuts=el('div','');shortcuts.className='mpGrid';mpTile('Músicas curtidas',db.fav.length+' músicas',db.fav[0],()=>show('Favoritos',db.fav),shortcuts);mpTile('Sua biblioteca','Playlists e downloads',null,libraryPage,shortcuts);for(let [n,a] of Object.entries(db.lists).slice(0,4))mpTile(n,a.length+' músicas',a[0],()=>show('Playlist: '+n,a),shortcuts);let hero=el('section','');hero.className='hero';el('small','MUSICPLAY • SUA MÚSICA',hero);el('h2','O que vamos ouvir hoje?',hero);el('p','Encontre seus artistas e monte sua própria coleção.',hero);btn('Explorar músicas',()=>search('músicas gospel'),hero);let c=el('div','');c.className='cats';['Gospel','Louvor','Sertanejo','Rock','Pop','Instrumental'].forEach(x=>btn(x,()=>search(x+' músicas'),c));el('h2','Sua biblioteca');btn('☁ Sincronização na nuvem',cloudPage);btn('Minhas playlists',lists);btn('↓ Downloads offline',offline);btn('Adicionar link do YouTube',addLink);if(db.hist.length)showRecent();discoverHome()}function settings(){clear('Configurações');el('p','Para buscar dentro do aplicativo, informe uma chave da YouTube Data API v3. Sem chave, a busca abre o YouTube e você pode adicionar links manualmente.');let i=el('input','');i.type='password';i.placeholder='Chave da API';i.value=db.key||'';btn('Salvar',async()=>{db.key=i.value.trim();db.keyOwner=cloudUser?.uid||null;save();try{if(cloudUser)await syncSearchKey(true);home();notify(cloudUser?'Busca configurada e sincronizada':'Busca salva neste aparelho')}catch{notify('Chave salva localmente; sincronização pendente')}});el('p','Ao entrar com Google, a chave restrita do YouTube será recuperada da sua conta.');let a=el('a','Criar chave no Google Cloud');a.href='https://console.cloud.google.com/apis/library/youtube.googleapis.com';a.target='_blank';el('p','Dados locais preservados. Use Nuvem para sincronizar manualmente.');btn('☁ Sincronização na nuvem',cloudPage);btn('Instalar no iPhone',()=>alert('Abra o MusicPlay no Safari. Toque em Compartilhar e em Adicionar à Tela de Início.'));btn('Exportar playlists',exportLists);btn('Importar playlists',importLists);el('p','MusicPlay V2.1')}async function search(q){q=q.trim();if(!q)return;let revision=++searchRevision;$('q').value=q;clear('Busca: '+q);if(!db.key){let a=el('a','Buscar no YouTube ↗');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q);a.target='_blank';el('p','Copie o link da música escolhida e adicione à biblioteca.');btn('Adicionar link',addLink);btn('Configurar busca integrada',settings);return}el('p','Buscando…');try{let r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=20&q='+encodeURIComponent(q) + ($('filter').value?'&videoCategoryId=10':'')+'&key='+encodeURIComponent(db.key));let j=await r.json();if(revision!==searchRevision)return;if(!r.ok)throw Error(j.error?.message||'Erro');results=j.items.map(v=>({id:v.id.videoId,title:new DOMParser().parseFromString(v.snippet.title,'text/html').body.textContent,artist:v.snippet.channelTitle}));show('Resultados',results)}catch(e){if(revision!==searchRevision)return;clear('Não foi possível buscar');el('p',e.message);btn('Ajustes',settings)}}$('search').onsubmit=e=>{e.preventDefault();search($('q').value)};function addLink(){let s=prompt('Cole o link do vídeo do YouTube');if(!s)return;let id;try{let u=new URL(s);if(u.hostname==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.split('/')[2]}catch{}if(!/^[\w-]{11}$/.test(id||'')){alert('Link inválido');return}let title=prompt('Nome da música')||'Vídeo do YouTube';let v={id,title,artist:''};show('Música adicionada',[v]);play([v],0)}function show(t,arr){clear(t);let tools=el('div','');tools.className='mpTools';let filter=el('input','',tools);filter.placeholder='Filtrar músicas nesta lista';filter.type='search';let sort=el('select','',tools);for(let [v,label] of [['original','Ordem original'],['title','Título A–Z'],['artist','Artista A–Z']]){let o=el('option',label,sort);o.value=v}let view=arr.map((v,i)=>({v,i}));let cards=[];filter.oninput=()=>{let q=filter.value.toLocaleLowerCase();for(let x of cards)x.a.hidden=!(x.v.title+' '+(x.v.artist||'')).toLocaleLowerCase().includes(q)};sort.onchange=()=>{let sorted=cards.slice();if(sort.value!=='original')sorted.sort((a,b)=>String(a.v[sort.value]||'').localeCompare(String(b.v[sort.value]||''),'pt-BR'));for(let x of sorted)main.append(x.a)};if(arr.length&&t!=='Fila'){btn('▶ Tocar todas',()=>{failedTracks.clear();play(arr,0)});btn('🔀 Embaralhar',()=>{failedTracks.clear();randomMode=true;$('random').classList.add('active');play(arr,Math.floor(Math.random()*arr.length))})}if(!arr.length)el('p','Nenhuma música por enquanto.');arr.forEach((v,i)=>{let a=el('article','');cards.push({a,v});if(queue[idx]?.id===v.id)a.classList.add('mpCurrent');let r=el('div','',a);r.className='row';let im=el('img','',r);im.src=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';let d=el('div','',r);el('strong',v.title,d);el('p',v.artist||'',d);let b=el('div','',a);b.className='row';btn('▶',()=>{failedTracks.clear();play(arr,i)},b);im.tabIndex=0;im.setAttribute('role','button');im.setAttribute('aria-label','Reproduzir '+v.title);im.onclick=()=>{failedTracks.clear();play(arr,i)};im.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();im.click()}};btn('Tocar a seguir',()=>{if(!queue.length){play([v],0);return}queue.splice(idx+1,0,v);notify('Próxima música adicionada')},b);btn('＋ Fila',()=>{if(!queue.length){play([v],0);return}queue.push(v);notify('Adicionada à fila')},b);btn(db.fav.some(x=>x.id===v.id)?'♥':'♡',()=>{db.fav=db.fav.some(x=>x.id===v.id)?db.fav.filter(x=>x.id!==v.id):[v,...db.fav];save();show(t,t==='Favoritos'?db.fav:arr)},b);btn('+ Lista',()=>{let n=prompt('Nome da playlist (existente ou nova):',Object.keys(db.lists)[0]||'');if(!n?.trim())return;n=n.trim();if(!Object.hasOwn(db.lists,n))Object.defineProperty(db.lists,n,{value:[],writable:true,enumerable:true,configurable:true});if(!db.lists[n].some(x=>x.id===v.id))db.lists[n].push(v);save();alert('Adicionada!')},b);if(t==='Fila'){if(i>idx+1)btn('↑ Fila',()=>{[queue[i-1],queue[i]]=[queue[i],queue[i-1]];show('Fila',queue)},b);if(i>idx)btn('Remover da fila',()=>{queue.splice(i,1);show('Fila',queue)},b)}if(t.startsWith('Playlist: ')){if(i>0)btn('↑',()=>move(t,arr,i,-1),b);if(i<arr.length-1)btn('↓',()=>move(t,arr,i,1),b)}if(t.startsWith('Playlist: '))btn('Remover',()=>{let n=t.slice(10);db.lists[n]=arr.filter((_,k)=>k!==i);save();show(t,db.lists[n])},b)})}function lists(){clear('Minhas playlists');btn('Sua biblioteca',libraryPage);btn('+ Nova playlist',()=>{let n=prompt('Nome da playlist');if(n?.trim()&&!Object.hasOwn(db.lists,n.trim())){Object.defineProperty(db.lists,n.trim(),{value:[],enumerable:true,configurable:true,writable:true});save();lists()}});Object.keys(db.lists).forEach(n=>{let a=el('article','');el('h3',n,a);el('p',db.lists[n].length+' músicas',a);btn('Abrir',()=>show('Playlist: '+n,db.lists[n]),a);btn('▶ Tocar',()=>play(db.lists[n],0),a);btn('Renomear',()=>{let m=prompt('Novo nome',n);if(m?.trim()&&!Object.hasOwn(db.lists,m.trim())){Object.defineProperty(db.lists,m.trim(),{value:db.lists[n],enumerable:true,writable:true,configurable:true});delete db.lists[n];save();lists()}},a);btn('Excluir',()=>{if(confirm('Excluir playlist?')){delete db.lists[n];save();lists()}},a)})}function showRecent(){el('h2','Ouvidos recentemente');let g=el('div','');g.className='recentgrid';db.hist.slice(0,8).forEach((v,i)=>{let x=btn('',()=>play(db.hist,i),g);let im=el('img','',x);im.src=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';el('strong',v.title,x)})}
function knownMusic(){return [...new Map([...db.hist,...db.fav,...Object.values(db.lists).flat()].map(v=>[v.id,v])).values()]}
function discoverArtist(){let v=queue[idx];if(v?.artist&&v.artist!=='Biblioteca offline')artistPage(v.artist);else notify('Artista não identificado neste arquivo')}
function artistPage(name){clear(name);el('p','Músicas da sua biblioteca associadas a este artista ou canal.');let a=knownMusic().filter(v=>v.artist===name);if(a.length){btn('▶ Tocar músicas',()=>play(a,0));let g=el('div','');g.className='mpGrid';a.forEach((v,i)=>mpTile(v.title,v.artist,v,()=>play(a,i),g))}btn('Buscar mais músicas no YouTube',()=>search(name+' músicas'));btn('Buscar álbuns no YouTube',()=>search(name+' álbum completo'))}
function discoverHome(){let all=knownMusic(),artists=[...new Set(all.map(v=>v.artist).filter(x=>x&&x!=='Biblioteca offline'))].slice(0,8);if(artists.length){el('h2','Seus artistas e canais');let g=el('div','');g.className='mpArtistGrid';for(let name of artists)btn(name,()=>artistPage(name),g);el('h2','Descubra mais');let d=el('div','');d.className='mpDiscover';for(let name of artists.slice(0,4))btn('Mais de '+name,()=>search(name+' músicas'),d)}let mix=all.filter(v=>db.fav.some(x=>x.id===v.id)||db.hist.some(x=>x.id===v.id));if(mix.length){el('h2','Mix da sua biblioteca');btn('▶ Tocar mix',()=>{randomMode=true;$('random').classList.add('active');play(mix,Math.floor(Math.random()*mix.length))})}}
function mpTile(name,sub,v,fn,parent){let b=btn('',fn,parent);b.className='mpTile';let im=el('img','',b);im.src=v&&!v.id.startsWith('local-')?'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg':'icon.png';im.alt='';el('strong',name,b);el('small',sub,b)}
function libraryPage(){clear('Sua biblioteca');let tools=el('div','');tools.className='mpTools';btn('Playlists',lists,tools);btn('Favoritos',()=>show('Favoritos',db.fav),tools);btn('Downloads',offline,tools);btn('Nuvem',cloudPage,tools);btn('Histórico',()=>show('Histórico',db.hist),tools);let q=el('input','');q.placeholder='Pesquisar na biblioteca';q.className='mpSearch';let g=el('div','');g.className='mpGrid';let draw=()=>{g.replaceChildren();let term=q.value.toLocaleLowerCase();for(let [n,a] of Object.entries(db.lists))if(n.toLocaleLowerCase().includes(term))mpTile(n,a.length+' músicas',a[0],()=>show('Playlist: '+n,a),g);let all=[...new Map([...db.fav,...db.hist,...Object.values(db.lists).flat()].map(v=>[v.id,v])).values()];if(term){let matches=all.filter(v=>(v.title+' '+(v.artist||'')).toLocaleLowerCase().includes(term));for(let v of matches)mpTile(v.title,v.artist||'MusicPlay',v,()=>play(matches,matches.indexOf(v)),g)}};q.oninput=draw;draw()}
function likeCurrent(){let v=queue[idx];if(!v)return;db.fav=db.fav.some(x=>x.id===v.id)?db.fav.filter(x=>x.id!==v.id):[v,...db.fav];save();updateMini();notify(db.fav.some(x=>x.id===v.id)?'Adicionada aos favoritos':'Removida dos favoritos')}
function addCurrentToList(){let v=queue[idx];if(!v)return;let n=prompt('Nome da playlist',Object.keys(db.lists)[0]||'');if(!n?.trim())return;n=n.trim();if(!Object.hasOwn(db.lists,n))Object.defineProperty(db.lists,n,{value:[],enumerable:true,writable:true,configurable:true});if(!db.lists[n].some(x=>x.id===v.id))db.lists[n].push(v);save();notify('Adicionada à playlist')}
async function shareCurrent(){let v=queue[idx];if(!v)return;if(v.id.startsWith('local-')){let file=await audioOp('readonly',o=>o.get(v.id));if(file){notify('Para compartilhar o arquivo, use Offline > Compartilhar');return}notify('Baixe o arquivo primeiro');return}let url='https://www.youtube.com/watch?v='+v.id;try{if(navigator.share)await navigator.share({title:v.title,url});else{await navigator.clipboard.writeText(url);notify('Link copiado')}}catch(e){if(e.name!=='AbortError')notify('Não foi possível compartilhar')}}
let sleepTimer=null,sleepUntil=0;function sleepMenu(){let value=prompt('Parar após quantos minutos? (0 cancela)',sleepUntil?String(Math.max(1,Math.ceil((sleepUntil-Date.now())/60000))):'30');if(value===null)return;let m=Number(value);if(!Number.isFinite(m)||m<0||m>720){notify('Informe de 0 a 720 minutos');return}clearTimeout(sleepTimer);sleepUntil=0;if(m){sleepUntil=Date.now()+m*60000;sleepTimer=setTimeout(()=>{sleepUntil=0;stopPlayback();notify('Temporizador concluído')},m*60000)}notify(m?'Temporizador: '+m+' min':'Temporizador cancelado')}
function renderLibrary(){let p=$('library');p.replaceChildren();el('h2','Sua biblioteca',p);btn('+ Criar playlist',()=>{let n=prompt('Nome da playlist');if(n?.trim()&&!Object.hasOwn(db.lists,n.trim())){Object.defineProperty(db.lists,n.trim(),{value:[],enumerable:true,writable:true,configurable:true});save();lists()}},p);btn('♥ Músicas curtidas',()=>show('Favoritos',db.fav),p);btn('◷ Histórico',()=>show('Histórico',db.hist),p);btn('☷ Todas as playlists',lists,p);btn('↓ Downloads',offline,p);btn('☁ Nuvem',cloudPage,p);btn('⚙ Ajustes',settings,p);Object.keys(db.lists).forEach(n=>{let x=btn('',()=>show('Playlist: '+n,db.lists[n]),p);x.className='libitem';let v=db.lists[n][0];if(v){let im=el('img','',x);im.src=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg'}let d=el('div','',x);el('strong',n,d);el('small',db.lists[n].length+' músicas',d)})}
function updateMini(){let v=queue[idx];if(!v)return;for(let [id,value] of [['nowTitle',v.title],['nowArtist',v.artist||'MusicPlay'],['nowSource',v.id.startsWith('local-')?'ÁUDIO OFFLINE':'VÍDEO DO YOUTUBE']]){let node=$(id);if(node&&node.textContent!==value)node.textContent=value}let like=$('nowLike');if(like)like.textContent=db.fav.some(x=>x.id===v.id)?'♥ Curtida':'♡ Curtir';let cover=v.id.startsWith('local-')?'icon.png':'https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';if($('miniCover').getAttribute('src')!==cover)$('miniCover').src=cover;$('miniTitle').textContent=v.title;$('miniArtist').textContent=v.artist||'MusicPlay';let playing=false,t=0,d=0;try{if(offlineAudio){playing=!offlineAudio.paused;t=offlineAudio.currentTime;d=offlineAudio.duration}else if(yt){playing=yt.getPlayerState()===1;t=yt.getCurrentTime();d=yt.getDuration()}}catch{}$('miniPause').textContent=playing?'❚❚':'▶';$('miniPause').setAttribute('aria-label',playing?'Pausar':'Reproduzir');$('miniProgress').style.width=(Number.isFinite(d)&&d>0?Math.min(100,t/d*100):0)+'%'}
function stopPlayback(){++token;wantsPlay=false;playerReady=false;stopLocal();if(yt){try{yt.destroy()}catch{}yt=null}queue=[];idx=0;$('player').replaceChildren();$('track').textContent='Nenhuma música selecionada';$('emptyNow').hidden=false;$('lyricsPanel').hidden=true;$('pause').textContent='▶';$('seek').value=0;$('elapsed').textContent=$('duration').textContent='0:00';document.body.classList.remove('playing');document.body.classList.add('panelHidden')}
setInterval(updateMini,250);
function togglePlay(){if(!queue.length){if(results.length){play(results,0);return}home();$('q').focus();return}if(offlineAudio){if(offlineAudio.paused)offlineAudio.play().catch(()=>{});else offlineAudio.pause();return}if(!playerReady){requestPlayback();return}try{if(yt.getPlayerState()===1){wantsPlay=false;yt.pauseVideo()}else requestPlayback()}catch{requestPlayback()}}
