<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101116"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><title>MusicPlay</title><style>body{background:#101116;color:#fff;font:16px system-ui;margin:0;padding:20px 16px 100px}h1{color:#45e49b}button,input,select{font:inherit;border:0;border-radius:12px;padding:12px;background:#282a33;color:white}button{cursor:pointer}input{min-width:0;flex:1}form,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{position:fixed;bottom:0;left:0;right:0;background:#191b22;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:3}nav button{font-size:12px;padding:9px 5px;background:none}article{background:#20222a;padding:12px;border-radius:12px;margin:10px 0}article img{width:100px;border-radius:8px}small{color:#aaa}iframe{width:100%;aspect-ratio:16/9;border:0}#player:empty{display:none}.green{background:#45e49b;color:#101116}a{color:#45e49b}.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cats button{padding:24px;background:#254b40}#player{margin:12px 0}h2{font-size:20px}body{max-width:1000px;margin:auto;padding:24px 16px 110px;background:linear-gradient(155deg,#18362d,#101116 340px);min-height:100vh;box-sizing:border-box}h1{letter-spacing:-1px}article{display:flex;justify-content:space-between;align-items:center;gap:12px}article img{width:90px}article p{margin:5px 0;color:#aaa;font-size:13px}.cats{grid-template-columns:repeat(3,1fr)}.cats button{font-weight:bold;text-align:left;min-height:90px}.cats button:nth-child(2){background:#604789}.cats button:nth-child(3){background:#80512d}.cats button:nth-child(4){background:#873b49}.cats button:nth-child(5){background:#315b85}.cats button:nth-child(6){background:#37646a}#player{max-width:640px;margin:16px auto}#controls{text-align:center}nav{backdrop-filter:blur(16px)}.active{background:#45e49b;color:#101116}@media(max-width:600px){.cats{grid-template-columns:1fr 1fr}article{display:block}article>.row:last-child{margin-top:8px}iframe{min-height:200px}input{font-size:16px}}</style><h1>♫ MusicPlay</h1><form id="search"><input id="q" placeholder="Música, artista ou álbum" required><button class="green">Buscar</button></form><select id="filter" aria-label="Filtro"><option value="">Todos os vídeos</option><option value="10">Música</option></select><div id="player"></div><div id="controls" hidden><button onclick="step(-1)">⏮</button> <button onclick="step(1)">⏭</button> <button id="random" onclick="shuffle()">🔀 Aleatório</button> <button id="repeat" onclick="repeat()">↻ Repetir: não</button> <button onclick="show('Fila',queue)">Fila</button></div><main id="main"></main><nav><button onclick="home()">⌂ Início</button><button onclick="lists()">☷ Playlists</button><button onclick="show('Favoritos',db.fav)">♡ Favoritos</button><button onclick="show('Histórico',db.hist)">◷ Histórico</button><button onclick="settings()">⚙ Ajustes</button></nav><script>
const $=id=>document.getElementById(id), main=$('main');let db;try{db=JSON.parse(localStorage.musicplay)||{}}catch{db={}};db.fav??=[];db.hist??=[];db.lists??={};let queue=[],idx=0,results=[],randomMode=false,repeatMode=0,yt=null,token=0;const save=()=>localStorage.musicplay=JSON.stringify(db);function el(tag,t,parent=main){let e=document.createElement(tag);e.textContent=t;parent.append(e);return e}function btn(t,f,p=main){let e=el('button',t,p);e.onclick=f;return e}function clear(t){main.replaceChildren();el('h2',t)}function home(){clear('O que vamos ouvir?');let c=el('div','');c.className='cats';['Gospel','Louvor','Sertanejo','Rock','Pop','Instrumental'].forEach(x=>btn(x,()=>search(x+' músicas'),c));el('h2','Sua biblioteca');btn('Minhas playlists',lists);btn('Adicionar link do YouTube',addLink);if(db.hist.length)showRecent()}function settings(){clear('Configurações');el('p','Para buscar dentro do aplicativo, informe uma chave da YouTube Data API v3. Sem chave, a busca abre o YouTube e você pode adicionar links manualmente.');let i=el('input','');i.type='password';i.placeholder='Chave da API';i.value=db.key||'';btn('Salvar',()=>{db.key=i.value.trim();save();home()});let a=el('a','Criar chave no Google Cloud');a.href='https://console.cloud.google.com/apis/library/youtube.googleapis.com';a.target='_blank';el('p','Dados salvos neste navegador. Não há sincronização entre aparelhos.');btn('Exportar playlists',exportLists);btn('Importar playlists',importLists);el('p','MusicPlay V1.1')}async function search(q){$('q').value=q;clear('Busca: '+q);if(!db.key){let a=el('a','Buscar no YouTube ↗');a.href='https://www.youtube.com/results?search_query='+encodeURIComponent(q);a.target='_blank';el('p','Copie o link da música escolhida e adicione à biblioteca.');btn('Adicionar link',addLink);btn('Configurar busca integrada',settings);return}el('p','Buscando…');try{let r=await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=20&q='+encodeURIComponent(q) + ($('filter').value?'&videoCategoryId=10':'')+'&key='+encodeURIComponent(db.key));let j=await r.json();if(!r.ok)throw Error(j.error?.message||'Erro');results=j.items.map(v=>({id:v.id.videoId,title:new DOMParser().parseFromString(v.snippet.title,'text/html').body.textContent,artist:v.snippet.channelTitle}));show('Resultados',results)}catch(e){clear('Não foi possível buscar');el('p',e.message);btn('Ajustes',settings)}}$('search').onsubmit=e=>{e.preventDefault();search($('q').value)};function addLink(){let s=prompt('Cole o link do vídeo do YouTube');if(!s)return;let id;try{let u=new URL(s);if(u.hostname==='youtu.be')id=u.pathname.split('/')[1];else if(['youtube.com','www.youtube.com','m.youtube.com','music.youtube.com'].includes(u.hostname))id=u.searchParams.get('v')||u.pathname.split('/')[2]}catch{}if(!/^[\w-]{11}$/.test(id||'')){alert('Link inválido');return}let title=prompt('Nome da música')||'Vídeo do YouTube';let v={id,title,artist:''};show('Música adicionada',[v]);play([v],0)}function show(t,arr){clear(t);if(!arr.length)el('p','Nenhuma música por enquanto.');arr.forEach((v,i)=>{let a=el('article',''),r=el('div','',a);r.className='row';let im=el('img','',r);im.src='https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';let d=el('div','',r);el('strong',v.title,d);el('p',v.artist||'',d);let b=el('div','',a);b.className='row';btn('▶',()=>play(arr,i),b);btn(db.fav.some(x=>x.id===v.id)?'♥':'♡',()=>{db.fav=db.fav.some(x=>x.id===v.id)?db.fav.filter(x=>x.id!==v.id):[v,...db.fav];save();show(t,t==='Favoritos'?db.fav:arr)},b);btn('+ Lista',()=>{let n=prompt('Nome da playlist (existente ou nova):',Object.keys(db.lists)[0]||'');if(!n?.trim())return;n=n.trim();if(!Object.hasOwn(db.lists,n))Object.defineProperty(db.lists,n,{value:[],writable:true,enumerable:true,configurable:true});if(!db.lists[n].some(x=>x.id===v.id))db.lists[n].push(v);save();alert('Adicionada!')},b);if(t.startsWith('Playlist: ')){if(i>0)btn('↑',()=>move(t,arr,i,-1),b);if(i<arr.length-1)btn('↓',()=>move(t,arr,i,1),b)}if(t.startsWith('Playlist: '))btn('Remover',()=>{let n=t.slice(10);db.lists[n]=arr.filter((_,k)=>k!==i);save();show(t,db.lists[n])},b)})}function lists(){clear('Minhas playlists');btn('+ Nova playlist',()=>{let n=prompt('Nome da playlist');if(n?.trim()&&!Object.hasOwn(db.lists,n.trim())){Object.defineProperty(db.lists,n.trim(),{value:[],enumerable:true,configurable:true,writable:true});save();lists()}});Object.keys(db.lists).forEach(n=>{let a=el('article','');el('h3',n,a);el('p',db.lists[n].length+' músicas',a);btn('Abrir',()=>show('Playlist: '+n,db.lists[n]),a);btn('▶ Tocar',()=>play(db.lists[n],0),a);btn('Renomear',()=>{let m=prompt('Novo nome',n);if(m?.trim()&&!Object.hasOwn(db.lists,m.trim())){Object.defineProperty(db.lists,m.trim(),{value:db.lists[n],enumerable:true,writable:true,configurable:true});delete db.lists[n];save();lists()}},a);btn('Excluir',()=>{if(confirm('Excluir playlist?')){delete db.lists[n];save();lists()}},a)})}function showRecent(){el('h2','Ouvidos recentemente');db.hist.slice(0,4).forEach((v,i)=>{let a=el('article','');let im=el('img','',a);im.src='https://i.ytimg.com/vi/'+v.id+'/mqdefault.jpg';btn(v.title,()=>play(db.hist,i),a)})}
function move(t,a,i,d){[a[i],a[i+d]]=[a[i+d],a[i]];save();show(t,a)}
function exportLists(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({lists:db.lists},null,2)],{type:'application/json'}));a.download='musicplay-playlists.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importLists(){let f=document.createElement('input');f.type='file';f.accept='.json,application/json';f.onchange=async()=>{try{let j=JSON.parse(await f.files[0].text());if(!j.lists||typeof j.lists!=='object'||Array.isArray(j.lists))throw Error();for(let [n,a] of Object.entries(j.lists)){if(!n.trim()||!Array.isArray(a)||!a.every(v=>v&&/^[\w-]{11}$/.test(v.id)&&typeof v.title==='string'))throw Error()}for(let [n,a] of Object.entries(j.lists)){let old=Object.hasOwn(db.lists,n)?db.lists[n]:[];Object.defineProperty(db.lists,n,{value:[...new Map([...old,...a.map(v=>({id:v.id,title:v.title,artist:String(v.artist||'')}))].map(v=>[v.id,v])).values()],writable:true,enumerable:true,configurable:true})}save();lists()}catch{alert('Arquivo inválido')}};f.click()}
let apiReady=new Promise(resolve=>{window.onYouTubeIframeAPIReady=resolve;let script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.append(script)});
function play(a,i){if(!a[i])return;queue=a.slice();idx=i;let v=queue[idx],current=++token;db.hist=[v,...db.hist.filter(x=>x.id!==v.id)].slice(0,100);save();if(yt){try{yt.destroy()}catch{}yt=null}let p=$('player');p.replaceChildren();el('strong',v.title,p);let f=el('iframe','',p);f.id='ytframe';f.title=v.title;f.src='https://www.youtube-nocookie.com/embed/'+v.id+'?playsinline=1&autoplay=1&enablejsapi=1&origin='+encodeURIComponent(location.origin);f.allow='autoplay; encrypted-media; picture-in-picture; fullscreen';f.allowFullscreen=true;let status=el('p','',p);let l=el('a','Abrir no YouTube',p);l.href='https://www.youtube.com/watch?v='+v.id;l.target='_blank';l.rel='noopener';$('controls').hidden=false;apiReady.then(()=>{if(current!==token)return;yt=new YT.Player(f,{events:{onStateChange:e=>{if(current===token&&e.data===0){if(repeatMode===1)play(queue,idx);else if(randomMode||idx<queue.length-1||repeatMode===2)step(1)}},onError:()=>{if(current===token)status.textContent='Vídeo indisponível. Abra no YouTube ou avance.'}}})}).catch(()=>{});p.scrollIntoView({block:'nearest',behavior:'smooth'})}
function step(n){if(!queue.length)return;let next=(idx+n+queue.length)%queue.length;if(randomMode&&n>0&&queue.length>1)next=(idx+1+Math.floor(Math.random()*(queue.length-1)))%queue.length;play(queue,next)}
function shuffle(){randomMode=!randomMode;$('random').classList.toggle('active',randomMode)}
function repeat(){repeatMode=(repeatMode+1)%3;$('repeat').textContent=['↻ Repetir: não','↻ Repetir: uma','↻ Repetir: fila'][repeatMode];$('repeat').classList.toggle('active',repeatMode!==0)}
home();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
